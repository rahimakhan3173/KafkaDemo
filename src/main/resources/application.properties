spring.application.name=KafkaDemo

#bootstrap-servers is the broker address.
spring.kafka.bootstrap-servers=localhost:9092  

#group-id is the consumer group. Consumers in the same group share the topic's partitions.
spring.kafka.consumer.group-id=demo-group

#earliest means a new group reads the topic from the start.
spring.kafka.consumer.auto-offset-reset=earliest

